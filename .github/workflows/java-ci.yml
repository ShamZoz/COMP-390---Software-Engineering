name: Run Standalone JUnit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JUnit Console Standalone
        run: |
          mkdir -p .junit
          curl -sSL -o .junit/junit-platform-console-standalone.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar

      - name: Compile all Java files
        run: |
          mkdir -p out
          javac -d out -cp ".junit/*" $(find . -name "*.java")

      - name: Execute JUnit tests
        run: |
          java -jar .junit/junit-platform-console-standalone.jar execute \
            --class-path out \
            --scan-class-path
